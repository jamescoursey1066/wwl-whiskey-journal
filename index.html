  "Mellow Corn":{event:"Heaven Hill",text:"Mellow Corn is a cult classic precisely because it plays by a different rulebook than bourbon, and the barrel is the giveaway. As a straight corn whiskey it must be at least 80% corn — Mellow Corn runs around 90% corn with a little rye and malted barley — and by law corn whiskey is aged in used or uncharred oak rather than the new charred barrels bourbon requires. Here it\u0027s four years in once-used bourbon barrels, so the wood has already surrendered its aggressive tannins and fresh char, letting the corn\u0027s own sweet, buttery, popcorn-and-cereal character stay front and center instead of being wrapped in heavy oak. It\u0027s Bottled-in-Bond: one distillery, one season, at least four years, and exactly 100 proof under federal supervision. That\u0027s a lot of guarantee and a lot of proof for a famously cheap yellow-label bottle. The result is soft, sweet, and grain-forward — corn whiskey showing what the base spirit tastes like when oak is deliberately kept in the background.",fl:{grain:9,fruit:1,floral:1,sweet:5,spice:1,smoke:1,oak:2,rich:4}},
  "Willett Pot Still Reserve Kentucky Bourbon":{event:"Willett Distillery",text:"The famous pot-still-shaped bottle is a literal advertisement for how this is made. Willett runs the Kulsveen family\u0027s operation in Bardstown, and as of 2024 the Pot Still Reserve is 100% distilled in-house on their pot still rather than sourced, as it was for years. The mashbill is the real point of interest: 65% corn, 20% wheat, and an unusually high 15% malted barley. The wheat swaps rye\u0027s pepper for a softer, bready sweetness, while that heavy malted-barley fraction — far above the 5% or so most bourbons use — brings a nutty, cereal-driven, almost graham-cracker depth that\u0027s a Willett signature. Eight to ten years of Kentucky aging rounds it into caramel and soft oak at an easygoing 94 proof, low enough that the grain character stays legible rather than buried under barrel strength. It\u0027s a wheated bourbon that reads gentler and maltier than the wheated-bourbon crowd usually does, which is exactly the house style Willett built its reputation on.",fl:{grain:2,fruit:6,floral:4,sweet:3,spice:5,smoke:1,oak:3,rich:3}},
  "Weller 107":{event:"Buffalo Trace Distillery",text:"Weller Antique 107 is built on Buffalo Trace\u0027s wheated mashbill — the same recipe family behind Pappy Van Winkle — where wheat replaces rye as the secondary grain. That single substitution changes the whole personality: without rye\u0027s pepper and bite, the whiskey leans soft, sweet, and rounded, letting vanilla, caramel, and a doughy, bread-like wheat character lead, with a gentle cinnamon note on the close. The \"107\" is the proof, and it\u0027s the reason this bottling has a following — that extra strength gives the naturally soft wheated profile some backbone and grip it can lack at 90 proof, so it drinks richer and more full-bodied without turning hot. There\u0027s no age statement, so it\u0027s blended for a consistent flavor target rather than a set number of years. It\u0027s the wheated-bourbon idea in accessible, higher-proof form: everything gentle and sweet about a wheater, but with enough proof-driven density to feel serious. Small wonder it\u0027s one of the most hunted bottles on the everyday shelf.",fl:{grain:2,fruit:4,floral:1,sweet:8,spice:5,smoke:1,oak:5,rich:6}},
  "Pursuit Double Oaked Rye":{event:"Pursuit Spirits",text:"Pursuit starts from its signature Triple Mash rye — the Sagamore Spirit and Bardstown Bourbon Company blend of Maryland and Kentucky ryes — then gives it a second maturation, and that finishing wood is the whole story here. The staves are French oak, lightly toasted and then heavily charred, a deliberately split treatment: the light toast develops eugenol baking spice and softer vanilla-adjacent sweetness, while the heavy char layers in the darker, smokier caramel and toasted-oak weight on top. Riding on a base rye that already leans peppery and herbal, the double-oaking pushes the profile toward baked spice, dark sugar, and a rounder, more dessert-like body without burying the rye\u0027s dry backbone. It\u0027s bottled at 108 proof and non-chill filtered, keeping the texture plush. The idea is a rye that drinks fuller and sweeter than the standard 108, aimed at drinkers who want the spice framed in oak rather than left bare.",fl:{grain:3,fruit:2,floral:5,sweet:5,spice:4,smoke:1,oak:6,rich:5}},
  "Wattie Boone 250th Anniversary":{event:"Preservation Distillery",text:"Wattie Boone is Preservation Distillery\u0027s history-minded label, named for a distiller some historians credit as one of Kentucky\u0027s earliest documented bourbon makers, working in the late 1700s. This 250th Anniversary Edition — marking America\u0027s semiquincentennial — is a tiny, deliberate blend of just two barrels: an 11-year-old Kentucky bourbon and a 22-year-old Tennessee bourbon, married and bottled at 124.8 proof with only 250 bottles released. Blending two casks this far apart in age is the whole exercise: the 22-year Tennessee barrel brings deep, resinous old oak, leather, and concentrated dark fruit that flirts with over-oaking, while the younger 11-year Kentucky bourbon adds brighter sweetness and fresher grain to keep it lively and drinkable. At nearly 125 proof, uncut, the pour carries every bit of that age and tannin with a dense, chewy body. It\u0027s less a production story than a curation story — two very old barrels chosen to complement each other, bottled at full strength for a commemorative release that\u0027s gone almost as soon as it appears.",fl:{grain:2,fruit:4,floral:2,sweet:3,spice:6,smoke:3,oak:6,rich:5}},
  "Weller Full Proof":{event:"Buffalo Trace Distillery",text:"Weller Full Proof runs the same Buffalo Trace wheated mashbill as the rest of the line — wheat standing in for rye to give that soft, sweet, low-spice profile — but the \"Full Proof\" name carries a specific meaning: it\u0027s bottled at 114 proof, the exact strength at which the whiskey entered the barrel. Nothing was proofed down after aging, so the barrel\u0027s concentration is preserved intact. It\u0027s also non-chill filtered, which keeps the fatty acids and esters in place for a thicker, more coating mouthfeel that chill filtration would strip out. On a wheated bourbon, that combination is potent: the gentle vanilla, caramel, and bread-dough sweetness of the wheat arrive dense and full, with the higher proof adding a firm, warming backbone the softer Weller bottlings don\u0027t have. Without rye to supply spice, the intensity here comes from proof and texture rather than pepper. It rewards a few drops of water, which bloom the wheated sweetness, but the point of Full Proof is the undiluted, barrel-entry-strength expression of Buffalo Trace\u0027s most famous wheated recipe.",fl:{grain:2,fruit:4,floral:1,sweet:5,spice:6,smoke:1,oak:6,rich:7}},
  "Very Old St. Nick Immaculata Bourbon 2022":{event:"Preservation Distillery",text:"Immaculata is Preservation Distillery\u0027s flagship under the Very Olde St. Nick label — a brand born in 1986 for the Japanese export market and now assembled at the small pot-still farm-distillery in Bardstown that Marci Palatella runs. The point of Immaculata is that it\u0027s re-blended fresh every year, so each annual release is its own marriage of aged sourced Kentucky bourbon and Preservation\u0027s own pot-distilled stock rather than a fixed recipe; the 2022 edition is its own distinct vatting, assembled to a cask-strength profile and bottled uncut. What stays constant across vintages is the philosophy: pull genuinely old barrels for depth and old-oak character, then use younger, softer house distillate to round the blend and keep it from turning dry or over-tannic. Bottled at full barrel strength, it holds the viscosity and oils that let the age show without water thinning it out. Because it\u0027s a small-batch annual blend, comparing one year to the next is half the fun — 2022 is a snapshot of that year\u0027s barrel selection.",fl:{grain:1,fruit:6,floral:2,sweet:6,spice:4,smoke:3,oak:5,rich:6}},
  "Pursuit Barrel Proof Bourbon":{event:"Pursuit Spirits",text:"Same three-state blend Ryan Cecil builds for the standard bourbon — Bardstown Bourbon Company\u0027s 78/10/12 from Kentucky, Finger Lakes Distilling\u0027s wheated 70/20/10 from New York, and an undisclosed Tennessee 80/10/10 — but bottled uncut at barrel strength. With no water added back, the whiskey keeps every fatty acid and ester it pulled from the wood, so the three mashbills arrive at full intensity: the Kentucky base turns to dense caramel and maple, the New York wheat\u0027s orchard fruit deepens toward baked apple, and the Tennessee component\u0027s sweet oak thickens the body. Non-chill filtered, it holds the oils that give a barrel-proof pour its coating, syrupy weight. The blending challenge is sharper at this proof — nothing hides, and any component that\u0027s too hot or too flat shows immediately — so a successful batch is a real demonstration of Cecil\u0027s palate. A little water opens the wheat\u0027s brighter notes and softens the heat without collapsing the structure.",fl:{grain:3,fruit:2,floral:1,sweet:6,spice:3,smoke:1,oak:7,rich:7}},
  "Pursuit Double Oaked":{event:"Pursuit Spirits",text:"This takes Pursuit\u0027s three-state signature bourbon blend and hands it a long secondary maturation, and the finishing wood is where the character comes from. The staves are French oak seasoned for a full 36 months and given a medium toast — the extended air-drying breaks down harsh tannins before the wood ever touches whiskey, and the medium toast favors vanillin and butterscotch-leaning sugars over the sharper, smokier compounds a heavy char would push. Sitting on a base blend that already carries Kentucky caramel, New York wheat fruit, and Tennessee sweet oak, the second oaking drives the profile toward heavy butterscotch, deep amber color, and a velvety, almost syrupy mouthfeel — a deliberately nostalgic, dessert-style bourbon. It\u0027s bottled at 108 proof and non-chill filtered so the added richness has body to sit on. Where the standard bourbon is about balance across regions, Double Oaked is about texture and sweetness, leaning fully into what patient finishing wood can layer on top of an already-mature blend.",fl:{grain:2,fruit:1,floral:1,sweet:6,spice:1,smoke:1,oak:5,rich:2}},
  "Woodford Reserve Batch Proof":{event:"Woodford Reserve",text:"Batch Proof is the standard Woodford recipe stripped of its usual restraint — the same pot-and-column blend on the 72% corn / 18% rye / 10% malted barley mashbill, but bottled at the natural strength of the batch rather than proofed down to the flagship\u0027s 90.4. Recent releases have landed around 118 proof. Taking Woodford to full strength changes the whole character: the triple-distilled pot-still component that normally reads as silky and polished now arrives dense and concentrated, with the fatty acids and esters that dilution would thin left fully in place. The rye spice, dark caramel, and cocoa notes hit with far more weight, and the texture turns viscous and coating. It\u0027s an annual limited release that shows what the everyday Distiller\u0027s Select is doing under the hood before Brown-Forman softens it for balance. A few drops of water pull it back toward the familiar Woodford elegance, but the point of Batch Proof is to meet the blend at full, undiluted intensity.",fl:{grain:3,fruit:4,floral:2,sweet:7,spice:6,smoke:2,oak:6,rich:8}},
  "Very Old St. Nick Immaculata Bourbon 2026":{event:"Preservation Distillery",text:"Very Olde St. Nick dates to 1986, originally a vintage-stock brand built for the Japanese export market, and it\u0027s now curated by Preservation Distillery, the tiny pot-still operation on a former Bardstown tobacco farm owned by Marci Palatella. Immaculata is the flagship, and the 2026 release is a three-part marriage that reportedly took a year to dial in: Preservation\u0027s own 8-year wheated, pot-distilled bourbon for softness and body; a 10-year Kentucky high-rye bourbon made to their spec for spine and spice; and an 18-year sourced Kentucky bourbon for deep, old-oak gravitas. The blending is the craft here — pairing young-ish house distillate with genuinely aged sourced whiskey so the result reads seamless rather than like three whiskeys in a glass. Bottled at cask strength, uncut, it keeps the oils and weight that carry all that age. It\u0027s a showcase of what a small blender can do with patience and access to old barrels: a rich, layered bourbon that leans on marrying rather than a single distillery\u0027s house style.",fl:{grain:3,fruit:2,floral:1,sweet:6,spice:5,smoke:3,oak:5,rich:5}},
  "Old Man Winter Cask Strength":{event:"Preservation Distillery",text:"Old Man Winter wears the marketing tag \"Bourbon from the Black Hills,\" which is frontier romance rather than geography — it\u0027s a Preservation Distillery blend built in Bardstown. The liquid marries two parts: a 6-plus-year wheated, pot-distilled bourbon from Preservation\u0027s own tiny still for softness and rounded body, and a 10-year traditional rye-recipe bourbon for spice and structure, drawing on both Kentucky and Indiana stock. The genuinely unusual move comes next: the finished blend is returned to its original emptied barrels for more than a year of additional aging. Re-barreling a marriage into the same wood it came from is uncommon, and it gives the components time to knit together and re-absorb barrel character, integrating what would otherwise taste like two distinct whiskeys. Bottled uncut and non-chill filtered at 54.9% ABV, it keeps a velvety mouthfeel and full flavor depth. It\u0027s a small-batch blending exercise where the extra maturation, not any single barrel, is what defines the finished bourbon.",fl:{grain:5,fruit:3,floral:2,sweet:6,spice:5,smoke:2,oak:6,rich:7}},
  "Pursuit Barrel Proof Rye":{event:"Pursuit Spirits",text:"This is the same Triple Mash blend that Ryan Cecil builds for the 108, but bottled uncut at barrel strength — recent batches have landed north of 120 proof. The recipe is unchanged: two Sagamore Spirit ryes from Maryland (a corn-rich 52% rye / 43% corn / 5% malted barley and a spice-driven 95% rye / 5% malted barley) married with a Bardstown Bourbon Company 95/5 from Kentucky. Taking it to full proof changes the physics of the pour — with no water added back, the fatty acids, esters, and ferulic-acid spice compounds stay concentrated, so the rye\u0027s pepper, dill, and dry herbal notes arrive with real force and the corn-rye sweetness reads as dense caramel rather than a light gloss. Non-chill filtered, it keeps the oils that give a barrel-proof rye its coating weight. It rewards a few drops of water, which pull the Maryland corn-rye\u0027s sweeter register forward and tame the heat without flattening the spice.",fl:{grain:2,fruit:2,floral:1,sweet:5,spice:5,smoke:1,oak:4,rich:6}},
  "Pursuit Honey Hog":{event:"Pursuit Spirits",text:"Honey Hog is a collaboration between Pursuit Spirits and Matt Pittman\u0027s Meat Church BBQ, and it was engineered for the dinner table rather than the dessert course. The base is a two-part bourbon blend — Bardstown Bourbon Company\u0027s 78% corn / 10% rye / 12% malted barley from Kentucky and an undisclosed Tennessee 80% corn / 10% rye / 10% malted barley. The trick is the finish: more than 55 gallons of Burleson\u0027s Texas Wildflower Honey were used to coat the insides of the finishing barrels, so the whiskey draws honey directly off the staves. That gives it wildflower honey, caramelized sugar, and a baklava-like layering of pastry and nuts — but the blenders deliberately dialed up the baking-spice on the back end so the sweetness could cut through smoke and fat instead of competing with a sweet dessert. Bottled at 105 proof, it\u0027s built as a pairing whiskey for smoked pork and ribs, which is a narrow brief and makes it a divisive sipper on its own.",fl:{grain:2,fruit:4,floral:5,sweet:6,spice:4,smoke:1,oak:5,rich:6}},
  "Woodford Reserve Baccarat Edition":{event:"Woodford Reserve",text:"The Baccarat Edition is Woodford\u0027s luxury statement, and the number that matters is the finishing time: roughly three years in XO Cognac casks, an unusually long secondary maturation when most finishes run months. Chris Morris hand-selected French casks that had each held XO cognac for three seasons before being filled with fully mature Woodford, so the barrels arrive deeply seasoned with cognac\u0027s dried-fruit, floral, and oak-spice character. Over three years, that slow exchange folds baking spice, cocoa, and bright citrus zest into the bourbon and buffs the texture to a satin, almost liqueur-like smoothness — the extended contact is what separates this from a quick finish that only skims the surface. It\u0027s presented at 90.4 proof in a hand-crafted Baccarat crystal decanter, which is as much of the price as the liquid. The base is still Woodford\u0027s balanced 72/18/10 pot-and-column blend, but the long cognac finish is the whole event: a deliberately opulent, dessert-adjacent pour built for occasions rather than everyday sipping.",fl:{grain:4,fruit:3,floral:1,sweet:6,spice:2,smoke:5,oak:6,rich:7}},
  "Michter\u0027s 10-Year Single Barrel Rye":{event:"Michter\u0027s Distillery",text:"This is the aged apex of Michter\u0027s rye program — the same one-cask-at-a-time honesty as the flagship US*1 Single Barrel, but held a full decade and bottled at a restrained 92.8 proof. The house method is the story: a low 103 barrel entry proof, against an industry-standard 125, means more water than usual goes into the wood, and because water and alcohol dissolve different compounds from oak, that dilution buys a rounder, more layered extraction over ten years — at the cost of far more barrels filled to yield the same whiskey. The mashbill stays undisclosed but drinks rye-forward, and heat-cycled warehouses force repeated wood expansion and contraction that, over a decade, pile ferulic-acid spice, dried baking-spice, and deep tannic oak onto the grain\u0027s herbal, faintly floral lift. Michter\u0027s taps each barrel on taste rather than age, so there\u0027s no batch to average out the extremes: the decade guarantees oak depth, but the exact balance of spice, caramel, and polished tannin is the fingerprint of that single cask.",fl:{grain:5,fruit:7,floral:2,sweet:5,spice:6,smoke:1,oak:7,rich:6}},
  "Central Waters 8-Year Bourbon":{event:"Central Waters",text:"Central Waters spent two decades in Amherst, Wisconsin building a reputation on bourbon-barrel-aged stouts — the Brewer\u0027s Reserve line taught the brewery exactly how spirit, wood, and time interact long before it ever bottled a whiskey of its own. Great Blue Spirits is that expertise pointed at bourbon. For the debut, co-owner Anello Mollica hand-selected 8-year-old barrels from undisclosed Kentucky partners and did the finishing and blending in-house in Amherst rather than distilling, so the craft here is selection and marrying, not the still. The whiskey drinks high-rye: an elevated rye fraction pushes ferulic-acid spice and a drier, peppery top line over the corn, giving it a leaner, more savory shape than a wheated or standard-rye bourbon of the same age. Eight years of Kentucky barrel time then layers on vanilla, caramelized hemicellulose sugars, and tannic grip, and at 100 proof it has the weight to carry all of it. A brewery that already understood barrels, choosing whiskey that rewards the knowledge.",fl:{grain:4,fruit:3,floral:2,sweet:7,spice:8,smoke:2,oak:7,rich:7}},
  "Still Austin The Musician Straight Bourbon Whiskey":{event:"Still Austin Whiskey Co.",text:"The Musician is Still Austin\u0027s flagship and one of the first genuinely grain-to-glass bourbons out of Austin — 100% Texas-grown grain on a mashbill of 70% white corn, 25% Elbon rye, and 5% Wildfire malted barley, distilled on \"Nancy,\" a 42-foot Forsyths column still. That quarter-rye fraction throws real ferulic-acid spice and a dry, peppery lift, while the elevated malted-barley share adds Maillard-driven bready, biscuit depth you won\u0027t get from corn alone. What sets the house apart is master blender Nancy Fraley\u0027s slow-water reduction — a Cognac-region technique she carried into whiskey, adding water to the barrel gradually over roughly six months instead of proofing down all at once. That patience lets the spirit integrate as it comes down, softening the alcohol\u0027s edge and coaxing mature vanilla and caramel forward rather than shocking the whiskey with a fast dilution. Matured in new charred American oak under a punishing Texas heat that accelerates extraction, it lands at 98.4 proof (49.2% ABV). Young in years, old in method.",fl:{grain:3,fruit:4,floral:4,sweet:6,spice:4,smoke:1,oak:6,rich:5}},
  "Starlight Bottled in Bond Bourbon":{event:"Starlight Distillery",text:"Since 1843, seven generations of the Huber family have farmed in the hills of Southern Indiana, producing wine, brandy, and (since 2013) bourbon, fed by fifty acres of their own estate grown corn. Master Distiller Ted Huber, along with his sons Christian and Blake, uses a sweet-mash process, starting every new batch with clean mash rather than backset with stillage. The resulting distillate runs at a higher pH than sour-mash, giving rounder, more ester-forward notes, without the typical lactic tang of many bourbons. The BiB blends three- and four-grain recipes (60/20/20 corn, rye, and malted barley, plus a 51/20/20/9 wheated version), which lays vegetal, nutty depth under vanillin and toasty furfural from the new charred oak. The rye component adds a peppery lift. There\u0027s noticeable variation among the different seasons of Starlight spirits, which is a feature rather than a defect. The family approaches distillation with a wine-maker\u0027s sensibility, following where the yeast, ferment, and barrel character take them.",fl:{grain:5,fruit:4,floral:2,sweet:6,spice:8,smoke:2,oak:5,rich:4}},
  "Heaven’s Door Revelation Double Barrel":{event:"Heaven\u0027s Door",text:"Revelation is a blended straight whiskey built for texture, and its name points at the method: two barrels\u0027 worth of maturation. The blend brings together two different straight bourbons and one straight rye, each aged independently for a minimum of five years, then married and given a second maturation of six to twelve months in custom barrels from the French cooperage Radoux. That secondary cask is the distinctive move — French oak coopered to Heaven\u0027s Door\u0027s spec, chosen to layer in a rounder, more European oak-spice and finer tannin than the whiskey\u0027s original American barrels contribute. Combining two bourbons with a rye lets the blender cover more ground than any single mashbill could: corn-sweet body and caramel from the bourbons, peppery lift from the rye, then knitted together in the Radoux wood so the seams disappear. Bottled around 100 proof, it\u0027s pitched as a smoother, more polished sipper than the higher-octane Ascension. The double-barrel finish, not any one component, is what gives Revelation its signature velvety character.",fl:{grain:5,fruit:7,floral:2,sweet:6,spice:4,smoke:1,oak:6,rich:6}},
  "Michter\u0027s Unblended American Whiskey":{event:"Michter\u0027s Distillery",text:"The whole identity here is the barrel Michter\u0027s refused to use. Bourbon law demands new charred oak; this whiskey instead matures in used, whiskey-soaked American white oak — staves that already surrendered their most aggressive tannins and raw char to an earlier fill. Spent cooperage can\u0027t donate the flood of fresh vanillin and caramelized sugar a virgin barrel would, so the spirit emerges gentler and rounder, its own grain left more exposed than any new-oak bourbon allows. You can read that restraint in the glass: grassy, honeysuckle-and-clover florals lift off the nose before the palate settles into cinnamon, nutmeg, caramel, toffee, and a soft cherry, with only a whisper of oak on the close. \"Unblended\" is literal — drawn from a single production and bottled without vatting across recipes, keeping it honest to one style. The house fundamentals still sit underneath: the low 103 entry proof that trades yield for a more layered extraction, and heat-cycled warehousing that keeps the wood working. Bottled at a modest 83.4, it chases elegance where most American whiskey reaches for the big sweet oak bomb.",fl:{grain:4,fruit:3,floral:5,sweet:5,spice:4,smoke:1,oak:3,rich:4}},
  "Old Fitzgerald 7 Year Old Bottled-in-Bond Bourbon":{event:"Wheated Whispers",text:"Old Fitzgerald\u0027s name dates to the 1870s, but most drinkers know only its lottery-driven decanter series. Heaven Hill Master Distiller Conor O\u0027Driscoll wanted a year-round bonded Old Fitz, so he built this seven-year expression on a 68/20/12 mashbill of corn, wheat, and malted barley. That 20% wheat stretches a soft biscuit-and-honey canvas that carries the vanillin, cis-whiskey lactones, and caramelized hemicellulose pulled from a #3 char on new American oak, all worked hard by the swings of Heaven Hill\u0027s traditional non-climate-controlled rickhouses. Bottled-in-bond at 100 proof, the aromatics concentrate into a burst of summertime citrus—orange, cherry, and apricot—before a cinnamon rush rolls over toasted oak and leather. The palate settles into creamy dessert territory: caramel syrup drizzled on vanilla soft-serve, the spice arriving like a warm snickerdoodle dusted with nutmeg. Toffee and a lingering cream see it out. Well-structured and unfussy, it is the very definition of a daily sipper.",fl:{grain:5,fruit:6,floral:2,sweet:7,spice:6,smoke:1,oak:5,rich:5}}
};

const COLS=[
  {k:"rank",l:"#",cls:"ctr"},
  {k:"img",l:"",cls:"ctr",nosort:true},
  {k:"tier",l:"Tier",cls:"ctr"},
  {k:"name",l:"Whiskey",cls:""},
  {k:"rating",l:"Rating",cls:"num"},
  {k:"price",l:"Price",cls:"num"},
  {k:"rbeu",l:"xRBEU",cls:"num"},
  {k:"fair",l:"Fair $",cls:"num"},
  {k:"proof",l:"Proof",cls:"num"},
  {k:"ppp",l:"$/Proof",cls:"num"},
  {k:"bbb",l:"BBB",cls:"ctr"},
];

function filtered(){
  const q=state.search.trim().toLowerCase();
  return CATALOG.rows.filter(r=>{
    if(state.tiers.size&&!state.tiers.has(r.tier))return false;
    if(state.bbbs.size&&!state.bbbs.has(r.bbb))return false;
    if(state.notesOnly&&!NOTES[r.name])return false;
    if(q&&!r.name.toLowerCase().includes(q)&&!(r.notes||"").toLowerCase().includes(q))return false;
    return true;
  });
}
function sorted(rows){
  const k=state.sortKey,d=state.sortDir==="asc"?1:-1;
  const tr={S:0,A:1,B:2,C:3,D:4,E:5,F:6};
  return rows.slice().sort((a,b)=>{
    let av=a[k],bv=b[k];
    if(k==="tier"){av=tr[av];bv=tr[bv];}
    if(typeof av==="string")return av.localeCompare(bv)*d;
    return((av||0)-(bv||0))*d;
  });
}

function renderCatalog(){
  state.notesOnly=document.getElementById('notes-only').checked;
  const rows=sorted(filtered());
  // header
  const head=document.getElementById('cat-head');
  head.innerHTML=COLS.map(c=>{
    const isSorted=state.sortKey===c.k;
    const cls=[c.cls,isSorted?'sorted '+state.sortDir:'',c.nosort?'no-sort':''].filter(Boolean).join(' ');
    return `<th class="${cls}" ${c.nosort?'':'onclick="sortBy(\''+c.k+'\')"'}>${c.l}</th>`;
  }).join('');
  // stats
  const st=document.getElementById('cat-stats');
  const avg=rows.reduce((s,r)=>s+r.rbeu,0)/rows.length;
  st.innerHTML=`<span><strong>${rows.length}</strong> / ${CATALOG.rows.length} shown</span>`+
    TIERS.map(t=>{const n=rows.filter(r=>r.tier===t).length;return n?`<span>${t}: <strong>${n}</strong></span>`:''}).join('')+
    `<span>Avg xRBEU: <strong>${(avg||0).toFixed(2)}</strong></span>`;
  // body
  const tbody=document.getElementById('cat-body');
  if(!rows.length){tbody.innerHTML=`<tr><td colspan="${COLS.length}" class="empty">No whiskies match your filters.</td></tr>`;return;}
  tbody.innerHTML=rows.map(r=>{
    const hasNote=!!NOTES[r.name];
    const imgSrc=r.img?(r.img.includes('cdn/shop/')?r.img+'&width=80':r.img):null;
    return `<tr class="${hasNote?'has-note':''}" onclick="${hasNote?`openNote('${r.name.replace(/'/g,"\\'")}')`:''}" title="${hasNote?'Click to view tasting note':''}">
      <td class="ctr">${r.rank}</td>
      <td class="ctr">${imgSrc?`<img class="thumb" src="${imgSrc}" loading="lazy" alt="" onclick="zoomImg(event,'${(r.img.includes('cdn/shop/')?r.img+'&width=600':r.img).replace(/'/g,"\\'")}')">`:`<span class="no-img"></span>`}</td>
      <td class="ctr"><span class="tier t${r.tier}">${r.tier}</span></td>
      <td><div class="name-cell">${r.name}${hasNote?'<span class="note-badge">Note</span>':''}</div><div class="song">${r.notes||''}</div></td>
      <td class="num">${r.rating % 1 === 0 ? r.rating.toFixed(0) : r.rating.toFixed(1)}</td>
      <td class="num">$${r.price.toFixed(2)}</td>
      <td class="num"><strong>${r.rbeu.toFixed(2)}</strong></td>
      <td class="num">$${r.fair.toFixed(2)}</td>
      <td class="num">${r.proof==null?'&mdash;':Math.round(r.proof*10)/10}</td>
      <td class="num">${r.ppp==null?'&mdash;':'$'+r.ppp.toFixed(2)}</td>
      <td class="ctr"><span class="bbb b${r.bbb}">${r.bbb}</span></td>
    </tr>`;
  }).join('');
}
function sortBy(k){
  if(state.sortKey===k)state.sortDir=state.sortDir==="asc"?"desc":"asc";
  else{state.sortKey=k;state.sortDir=(k==="name"||k==="tier"||k==="bbb")?"asc":"desc";}
  renderCatalog();
}

// ─── FLAVOR WHEEL ───────────────────────────────────────────────────
const DIMS=["Grain","Fruit","Floral","Sweet","Spice","Smoke","Oak","Rich"];
function radarSVG(fl){
  // Fixed coordinate space: 200×200 with data circle at r=52, labels at r=72
  // Gives enough room for all 8 labels without clipping
  const N=DIMS.length,cx=100,cy=100,r=52,lr=72;
  let grid='',axes='',lbls='';
  for(let g=1;g<=5;g++){
    const gr=r*g/5;
    const pts=DIMS.map((_,i)=>{const a=(i/N)*2*Math.PI-Math.PI/2;return`${(cx+gr*Math.cos(a)).toFixed(1)},${(cy+gr*Math.sin(a)).toFixed(1)}`;});
    grid+=`<polygon points="${pts.join(' ')}" fill="none" stroke="#e5e3dd" stroke-width="${g===5?1.5:1}"/>`;
  }
  DIMS.forEach((_,i)=>{const a=(i/N)*2*Math.PI-Math.PI/2;axes+=`<line x1="${cx}" y1="${cy}" x2="${(cx+r*Math.cos(a)).toFixed(1)}" y2="${(cy+r*Math.sin(a)).toFixed(1)}" stroke="#e5e3dd" stroke-width="1"/>`;});
  const scores=DIMS.map(d=>fl[d.toLowerCase()]||0);
  const pts=scores.map((s,i)=>{const a=(i/N)*2*Math.PI-Math.PI/2;const sr=r*s/10;return`${(cx+sr*Math.cos(a)).toFixed(1)},${(cy+sr*Math.sin(a)).toFixed(1)}`;});
  const poly=`<polygon points="${pts.join(' ')}" fill="rgba(107,62,31,0.22)" stroke="#6b3e1f" stroke-width="1.5"/>`;
  DIMS.forEach((d,i)=>{
    const a=(i/N)*2*Math.PI-Math.PI/2;
    const lx=cx+lr*Math.cos(a),ly=cy+lr*Math.sin(a);
    // Use precise anchor so diagonal labels don't drift: left half=end, right half=start, top/bottom=middle
    const anch=Math.abs(Math.cos(a))<0.1?"middle":Math.cos(a)<0?"end":"start";
    lbls+=`<text x="${lx.toFixed(1)}" y="${(ly+3.5).toFixed(1)}" text-anchor="${anch}" font-size="10" fill="#6b6b6b" font-family="-apple-system,sans-serif">${d}</text>`;
  });
  // viewBox adds 18px padding on each side for labels that extend outward
  return`<svg viewBox="-18 -18 236 236" xmlns="http://www.w3.org/2000/svg" style="width:190px;height:190px">${grid}${axes}${poly}${lbls}</svg>`;
}

// Sanctioned event for a note (only thematic events count; producer tags don't).
function noteEvent(n){return SANCTIONED_EVENTS.has(n.event)?n.event:null;}
// Producer for a note: derived map first, else fall back to its original (non-event) tag.
function noteProducer(name,n){return PRODUCER_MAP[name]||(SANCTIONED_EVENTS.has(n.event)?null:n.event)||null;}

function getEvents(){
  const evs=new Set();
  Object.values(NOTES).forEach(n=>{const e=noteEvent(n);if(e)evs.add(e);});
  return["All",...Array.from(evs).sort()];
}
function getProducers(){
  const ps=new Set();
  Object.entries(NOTES).forEach(([name,n])=>{const p=noteProducer(name,n);if(p)ps.add(p);});
  return["All",...Array.from(ps).sort((a,b)=>a.localeCompare(b))];
}

      <div><a href="${tastingMapUrl(name)}" target="_blank" title="Open full tasting map" style="display:block">${radarSVG(n.fl)}</a></div>
    </div>
    ${cat?.notes?`<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-style:italic">🎵 ${cat.notes}</div>`:''}
  `;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}

function zoomImg(e,src){
  e.stopPropagation();
  document.getElementById('modal-img-full-img').src=src;
  document.getElementById('modal-img-full').classList.add('open');
}


// ─── INIT ───────────────────────────────────────────────────────────
initChips();
initEventChips();
renderCatalog();
renderNotes();
</script>
</body>
</html>
