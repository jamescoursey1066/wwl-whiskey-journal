<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>My Tasting Map &middot; WWL</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:        #F4ECDA;
    --paper-soft:   #FAF6EC;
    --paper-deep:   #E8DCC1;
    --ink:          #1A1410;
    --ink-soft:     #3D332B;
    --ink-mute:     #6B5E52;
    --gold:         #CC9900;
    --gold-soft:    #E8C76A;
    --brown:        #996633;
    --brown-deep:   #5C3A1E;
    --display:      "Cinzel", "Perpetua Titling MT", Georgia, serif;
    --serif:        "Cormorant Garamond", "Perpetua", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(204,153,0,0.06), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(153,102,51,0.05), transparent 60%),
      var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  .page {
    max-width: 1500px;
    margin: 0 auto;
    padding: 56px 32px 80px;
  }

  /* Header lockup ------------------------------------------------ */
  header.lockup {
    text-align: center;
    margin-bottom: 24px;
  }
  .eyebrow {
    font-family: var(--display);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.32em;
    color: var(--brown);
    font-size: 14px;
    margin: 0 0 18px;
  }
  .eyebrow span.dot {
    display: inline-block;
    width: 4px; height: 4px;
    background: var(--gold);
    border-radius: 50%;
    vertical-align: middle;
    margin: -3px 14px 0;
  }
  h1.title {
    font-family: var(--display);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink);
    font-size: clamp(36px, 5vw, 64px);
    line-height: 1;
    margin: 0;
  }
  .rule {
    width: 96px;
    height: 1px;
    background: var(--gold);
    margin: 22px auto 18px;
    border: 0;
  }
  .tagline {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    color: var(--brown);
    margin: 0;
  }
  .meta {
    margin-top: 14px;
    font-family: var(--serif);
    color: var(--ink-mute);
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .meta b { color: var(--ink-soft); font-weight: 600; }

  /* Wheel surface ----------------------------------------------- */
  .wheel-frame {
    margin: 32px auto 0;
    background: var(--paper-soft);
    border: 1.5px solid var(--gold);
    box-shadow:
      0 1px 2px rgba(26,20,16,0.08),
      0 24px 64px rgba(26,20,16,0.10);
    padding: 24px;
    aspect-ratio: 1 / 1;
    max-width: 1400px;
    position: relative;
  }
  .wheel-frame::before,
  .wheel-frame::after {
    content: "";
    position: absolute;
    inset: 8px;
    border: 0.5px solid rgba(153,102,51,0.35);
    pointer-events: none;
  }
  .wheel-frame::after {
    inset: 14px;
    border: 0.5px solid rgba(204,153,0,0.30);
  }

  svg.wheel { display: block; width: 100%; height: auto; }

  /* SVG type styles --------------------------------------------- */
  .l1-text {
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    fill: #FAF6EC;
    font-size: 28px;
  }
  .l2-text {
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    fill: var(--brown-deep);
    font-size: 20px;
  }
  .l3-text {
    font-family: var(--serif);
    font-weight: 600;
    fill: var(--ink);
    font-size: 16px;
  }
  .center-line-1 {
    font-family: var(--display);
    font-weight: 500;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    fill: var(--brown);
    font-size: 14px;
  }
  .center-line-2 {
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    fill: var(--ink);
    font-size: 30px;
  }
  .center-line-3 {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    fill: var(--brown);
    font-size: 18px;
  }

  /* Footer / legend --------------------------------------------- */
  .legend {
    margin: 32px auto 0;
    max-width: 1200px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px 24px;
  }
  .legend-row {
    display: flex; align-items: center;
    gap: 10px;
    font-family: var(--serif);
    color: var(--ink-soft);
    font-size: 15px;
  }
  .legend-row b {
    font-family: var(--display);
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    font-size: 13px;
  }
  .swatch {
    width: 14px; height: 14px; flex: 0 0 14px;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .legend-row span.count { color: var(--ink-mute); font-size: 13px; }

  footer.colophon {
    margin-top: 56px;
    text-align: center;
    color: var(--ink-mute);
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: 0.06em;
  }
  footer.colophon b { color: var(--ink-soft); font-weight: 600; }

  /* Highlight states for tasting map -------------------------- */
  .wedge { transition: filter 180ms cubic-bezier(.4,0,.2,1), opacity 180ms; cursor: default; }
  /* Dim everything by default; tagged elements get amplified */
  svg.wheel.has-tasting .wedge:not(.is-tagged):not(.is-group) { opacity: 0.18; filter: saturate(0.35); }
  svg.wheel.has-tasting .wedge.l3.is-group:not(.is-tagged) { opacity: 0.55; filter: saturate(0.8); }
  svg.wheel.has-tasting .l1-text:not(.is-tagged),
  svg.wheel.has-tasting .l2-text:not(.is-tagged),
  svg.wheel.has-tasting .l3-text:not(.is-tagged):not(.is-group) { opacity: 0.32; }
  svg.wheel.has-tasting .l3-text.is-group:not(.is-tagged) { opacity: 0.75; }
  svg.wheel.has-tasting .src-band { opacity: 0.35; }
  svg.wheel.has-tasting .wedge.is-tagged.l3 { filter: saturate(1.25) brightness(0.95); }
  svg.wheel.has-tasting .wedge.is-tagged.l1 { filter: saturate(1.05) brightness(1.0); }
  svg.wheel.has-tasting .l3-text.is-tagged { fill: var(--ink); font-weight: 700; }
  svg.wheel.has-tasting .l2-text.is-tagged { fill: var(--brown-deep); }
  svg.wheel.has-tasting .l1-text.is-tagged { fill: #FAF6EC; }

  /* Tasting notes panel --------------------------------------- */
  .notes {
    margin: 36px auto 0;
    max-width: 1200px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }
  .note-card {
    background: var(--paper-soft);
    border: 1px solid var(--gold);
    padding: 24px 26px 26px;
    position: relative;
  }
  .note-card::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 0.5px solid rgba(153,102,51,0.25);
    pointer-events: none;
  }
  .note-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 0 0 10px;
  }
  .note-marker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: 50%;
    font-family: var(--display);
    font-weight: 600;
    font-size: 14px;
    color: var(--paper-soft);
    letter-spacing: 0;
    flex: 0 0 28px;
  }
  .note-marker.nose   { background: #5C3A1E; }
  .note-marker.palate { background: #B85A2B; }
  .note-marker.finish { background: #1A1410; }
  .note-title {
    font-family: var(--display);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink);
    font-size: 18px;
    margin: 0;
  }
  .note-rule { width: 36px; height: 1px; background: var(--gold); border: 0; margin: 4px 0 14px; }
  .note-body {
    font-family: var(--serif);
    font-style: italic;
    color: var(--ink-soft);
    font-size: 17px;
    line-height: 1.45;
    margin: 0 0 14px;
  }
  .note-tags {
    list-style: none;
    margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; gap: 6px 6px;
  }
  .note-tags li {
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: 0.10em;
    font-size: 11px;
    padding: 4px 9px;
    color: var(--ink-soft);
    background: var(--paper-deep);
    border: 0.5px solid var(--brown);
  }
  @media (max-width: 900px) {
    .notes { grid-template-columns: 1fr; }
  }

  /* Phase legend pinned in header ----------------------------- */
  .phase-key {
    display: inline-flex;
    gap: 22px;
    margin-top: 18px;
    align-items: center;
  }
  .phase-key span {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .phase-key i {
    width: 14px; height: 14px;
    border-radius: 50%;
    display: inline-block;
  }

  /* Bottle / spec line --------------------------------------- */
  .spec-line {
    margin-top: 18px;
    color: var(--ink-mute);
    font-family: var(--serif);
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .spec-line b { color: var(--ink-soft); font-weight: 600; }

  @media print {
    body { background: var(--paper); }
    .wheel-frame { box-shadow: none; }
  }

  /* rev. 11·27·2026 additions ---------------------------------- */
  .l1-text.l1-radial { letter-spacing: 0.14em; }
  .src-band { transition: opacity 180ms; }
  svg.wheel.has-hover .wedge:not(.is-hot) { opacity: 0.32; }
  svg.wheel.has-hover .l1-text:not(.is-hot),
  svg.wheel.has-hover .l2-text:not(.is-hot),
  svg.wheel.has-hover .l3-text:not(.is-hot) { opacity: 0.32; }
  .wedge.is-hot { filter: brightness(1.06); }
  .note-tags li.group { background: transparent; border: 0.5px dashed var(--brown); font-style: italic; }
  .note-tags li.group::after { content: " \2022 group"; text-transform: none; letter-spacing: 0.02em; color: var(--ink-mute); font-family: var(--serif); font-size: 12px; }
  .source-key { margin: 26px auto 0; max-width: 1200px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 24px; }
  .source-key-title { grid-column: 1 / -1; margin: 0 0 4px; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.18em; font-size: 13px; color: var(--brown); text-align: center; }
  .source-row { display: grid; grid-template-columns: 22px auto 1fr; column-gap: 8px; align-items: baseline; font-family: var(--serif); color: var(--ink-soft); font-size: 15px; }
  .source-row b { font-family: var(--display); font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); font-size: 13px; }
  .source-row .count { color: var(--ink-mute); font-size: 13px; }
  .source-chip { width: 22px; height: 8px; border-radius: 2px; display: inline-block; align-self: center; }
  .source-note { grid-column: 2 / -1; color: var(--ink-mute); font-size: 14px; font-style: italic; }
  .group-key { margin-top: 14px; font-family: var(--serif); font-style: italic; color: var(--ink-mute); font-size: 14px; }
  .group-key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--ink-soft); vertical-align: -1px; margin: 0 6px 0 0; }
  .legend-row b { white-space: nowrap; }

  /* Personal map: same Buhloh.buzz Tasting Map look, filled from the taster's own My Tastings entry. */
  .gate { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 40px; text-align: center;
    font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--ink-mute); }
  .page[hidden] { display: none; }
  .back { display: inline-block; margin-bottom: 26px; font-family: var(--display); font-size: 12px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--brown); text-decoration: none; border: 1px solid var(--gold); padding: 7px 16px; }
  .back:hover { background: var(--gold); color: var(--paper-soft); }
  .note-body.none { font-style: normal; color: var(--ink-mute); }
  .note-tags li.none { background: none; border-style: dashed; color: var(--ink-mute); }
  .unmatched { margin: 22px auto 0; max-width: 1200px; text-align: center; font-family: var(--serif); font-style: italic; color: var(--ink-mute); font-size: 16px; }
</style>
</head>
<body>
  <div class="gate" id="gate">Opening your tasting map&hellip;</div>
  <main class="page" id="page" hidden>
    <a class="back" href="portal.html#catalog">&larr; Back to My Catalog</a>
    <header class="lockup">
      <p class="eyebrow">Buhloh.buzz <span class="dot"></span> Personal Tasting Map</p>
      <h1 class="title" id="mTitle"></h1>
      <hr class="rule" />
      <p class="tagline" id="mTagline"></p>
      <p class="spec-line" id="mSpec"></p>
      <div class="phase-key">
        <span><i style="background:#5C3A1E"></i>Nose</span>
        <span><i style="background:#B85A2B"></i>Palate</span>
        <span><i style="background:#1A1410"></i>Finish</span>
      </div>
    </header>

    <div class="wheel-frame">
      <svg class="wheel" id="wheel" viewBox="0 0 1600 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Whiskey flavor wheel">
        <!-- generated by JS -->
      </svg>
    </div>

    <section class="notes" id="notes"></section>
    <p class="unmatched" id="mUnmatched" hidden></p>

    <footer class="colophon">
      <b>Buhloh.buzz Tasting Map</b> &nbsp;&middot;&nbsp;
      Notes plotted on the World Whiskey League Flavor Wheel &nbsp;&middot;&nbsp;
      <span id="mTasted"></span>
    </footer>
  </main>

<script>
//============================================================
// DATA — Buhloh.buzz Whiskey Flavor Wheel, rev. 11·27·2026
// l1 = family · l2 = group · l3 = leaf · src = where the flavor comes from
//============================================================
const RAW = [
  {l1:"Floral",l2:"Flower",l3:"Rose",src:"Ferment"},{l1:"Floral",l2:"Flower",l3:"Violet",src:"Ferment"},{l1:"Floral",l2:"Flower",l3:"Wildflower",src:"Ferment"},
  {l1:"Floral",l2:"Perfumed",l3:"Blossom",src:"Ferment"},{l1:"Floral",l2:"Perfumed",l3:"Perfume",src:"Ferment"},
  {l1:"Fruity",l2:"Stone",l3:"Cherry",src:"Ferment"},{l1:"Fruity",l2:"Stone",l3:"Apricot",src:"Ferment"},{l1:"Fruity",l2:"Stone",l3:"Plum",src:"Ferment"},{l1:"Fruity",l2:"Stone",l3:"Peach",src:"Ferment"},
  {l1:"Fruity",l2:"Orchard",l3:"Apple",src:"Ferment"},{l1:"Fruity",l2:"Orchard",l3:"Pear",src:"Ferment"},
  {l1:"Fruity",l2:"Berry",l3:"Red Berry",src:"Ferment"},{l1:"Fruity",l2:"Berry",l3:"Dark Berry",src:"Ferment"},
  {l1:"Fruity",l2:"Citrus",l3:"Lemon",src:"Ferment"},{l1:"Fruity",l2:"Citrus",l3:"Orange",src:"Ferment"},{l1:"Fruity",l2:"Citrus",l3:"Grapefruit",src:"Ferment"},
  {l1:"Fruity",l2:"Tropical",l3:"Banana",src:"Ferment"},{l1:"Fruity",l2:"Tropical",l3:"Pineapple",src:"Ferment"},{l1:"Fruity",l2:"Tropical",l3:"Bubble Gum",src:"Ferment"},
  {l1:"Fruity",l2:"Dried",l3:"Raisin",src:"Wood"},{l1:"Fruity",l2:"Dried",l3:"Prune",src:"Wood"},{l1:"Fruity",l2:"Dried",l3:"Fig",src:"Wood"},{l1:"Fruity",l2:"Dried",l3:"Date",src:"Wood"},
  {l1:"Cereal",l2:"Grain",l3:"Corn",src:"Grain"},{l1:"Cereal",l2:"Grain",l3:"Rye",src:"Grain"},{l1:"Cereal",l2:"Grain",l3:"Wheat",src:"Grain"},{l1:"Cereal",l2:"Grain",l3:"Malt",src:"Grain"},
  {l1:"Cereal",l2:"Baked",l3:"Bread",src:"Grain"},{l1:"Cereal",l2:"Baked",l3:"Biscuit/Graham",src:"Grain"},{l1:"Cereal",l2:"Baked",l3:"Pastry",src:"Grain"},
  {l1:"Cereal",l2:"Mash",l3:"Yeast",src:"Ferment"},{l1:"Cereal",l2:"Mash",l3:"Green Bean",src:"Ferment"},
  {l1:"Earthy",l2:"Green",l3:"Hay",src:"Grain"},{l1:"Earthy",l2:"Green",l3:"Grass",src:"Grain"},{l1:"Earthy",l2:"Green",l3:"Herbal",src:"Grain"},
  {l1:"Earthy",l2:"Ground",l3:"Mineral",src:"Ferment"},{l1:"Earthy",l2:"Ground",l3:"Mushroom",src:"Ferment"},{l1:"Earthy",l2:"Ground",l3:"Funk",src:"Ferment"},
  {l1:"Wood",l2:"Oak",l3:"Green Oak",src:"Wood"},{l1:"Wood",l2:"Oak",l3:"Toasted Oak",src:"Wood"},{l1:"Wood",l2:"Oak",l3:"Charred Oak",src:"Wood"},
  {l1:"Wood",l2:"Lactone",l3:"Coconut",src:"Wood"},{l1:"Wood",l2:"Lactone",l3:"Dill",src:"Wood"},
  {l1:"Wood",l2:"Aromatic",l3:"Cedar",src:"Wood"},{l1:"Wood",l2:"Aromatic",l3:"Pine/Resin",src:"Wood"},
  {l1:"Wood",l2:"Smoke",l3:"Wood Smoke",src:"Wood"},{l1:"Wood",l2:"Smoke",l3:"Peat Smoke",src:"Grain"},{l1:"Wood",l2:"Smoke",l3:"Medicinal",src:"Grain"},
  {l1:"Spice",l2:"Baking",l3:"Cinnamon",src:"Wood"},{l1:"Spice",l2:"Baking",l3:"Clove",src:"Wood"},{l1:"Spice",l2:"Baking",l3:"Nutmeg",src:"Wood"},{l1:"Spice",l2:"Baking",l3:"Allspice",src:"Wood"},{l1:"Spice",l2:"Baking",l3:"Ginger",src:"Wood"},
  {l1:"Spice",l2:"Pungent",l3:"Black Pepper",src:"Grain"},{l1:"Spice",l2:"Pungent",l3:"Hot Pepper",src:"Grain"},
  {l1:"Spice",l2:"Cooling",l3:"Mint",src:"Wood"},{l1:"Spice",l2:"Cooling",l3:"Anise/Licorice",src:"Wood"},
  {l1:"Spice",l2:"Rich",l3:"Leather",src:"Wood"},{l1:"Spice",l2:"Rich",l3:"Tobacco",src:"Wood"},{l1:"Spice",l2:"Rich",l3:"Coffee",src:"Wood"},{l1:"Spice",l2:"Rich",l3:"Tea",src:"Wood"},
  {l1:"Sweet",l2:"Syrupy",l3:"Vanilla",src:"Wood"},{l1:"Sweet",l2:"Syrupy",l3:"Caramel",src:"Wood"},{l1:"Sweet",l2:"Syrupy",l3:"Brown Sugar",src:"Wood"},{l1:"Sweet",l2:"Syrupy",l3:"Molasses",src:"Wood"},{l1:"Sweet",l2:"Syrupy",l3:"Maple Syrup",src:"Wood"},
  {l1:"Sweet",l2:"Candy",l3:"Toffee",src:"Wood"},{l1:"Sweet",l2:"Candy",l3:"Butterscotch",src:"Wood"},{l1:"Sweet",l2:"Candy",l3:"Burnt Sugar",src:"Wood"},{l1:"Sweet",l2:"Candy",l3:"Honey",src:"Wood"},{l1:"Sweet",l2:"Candy",l3:"Marshmallow",src:"Wood"},{l1:"Sweet",l2:"Candy",l3:"Icing",src:"Wood"},{l1:"Sweet",l2:"Candy",l3:"Chocolate",src:"Wood"},{l1:"Sweet",l2:"Candy",l3:"Cocoa",src:"Wood"},
  {l1:"Sweet",l2:"Dairy",l3:"Butter",src:"Ferment"},{l1:"Sweet",l2:"Dairy",l3:"Cream/Custard",src:"Wood"},
  {l1:"Sweet",l2:"Soda",l3:"Cream Soda",src:"Wood"},{l1:"Sweet",l2:"Soda",l3:"Cola",src:"Wood"},
  {l1:"Sweet",l2:"Finishing",l3:"Red Wine",src:"Finishing"},{l1:"Sweet",l2:"Finishing",l3:"Fortified Wine",src:"Finishing"},{l1:"Sweet",l2:"Finishing",l3:"Brandy",src:"Finishing"},{l1:"Sweet",l2:"Finishing",l3:"Rum",src:"Finishing"},
  {l1:"Savory",l2:"Nuts",l3:"Almond",src:"Wood"},{l1:"Savory",l2:"Nuts",l3:"Peanut",src:"Wood"},{l1:"Savory",l2:"Nuts",l3:"Hazelnut",src:"Wood"},{l1:"Savory",l2:"Nuts",l3:"Pecan",src:"Wood"},{l1:"Savory",l2:"Nuts",l3:"Walnut",src:"Wood"},
  {l1:"Savory",l2:"Meaty",l3:"Roast Meat",src:"Ferment"},{l1:"Savory",l2:"Meaty",l3:"Smoked Meat",src:"Wood"},
  {l1:"Structure",l2:"Texture",l3:"Thin",src:"Proof"},{l1:"Structure",l2:"Texture",l3:"Creamy",src:"Proof"},{l1:"Structure",l2:"Texture",l3:"Oily",src:"Proof"},{l1:"Structure",l2:"Texture",l3:"Waxy",src:"Proof"},{l1:"Structure",l2:"Texture",l3:"Astringent",src:"Wood"},
  {l1:"Structure",l2:"Taste",l3:"Tart",src:"Proof"},{l1:"Structure",l2:"Taste",l3:"Bitter",src:"Proof"},{l1:"Structure",l2:"Taste",l3:"Salty",src:"Proof"},
  {l1:"Structure",l2:"Heat",l3:"Ethanol",src:"Proof"},{l1:"Structure",l2:"Heat",l3:"Warming",src:"Proof"},
  {l1:"Off",l2:"Sulfury",l3:"Sulfur",src:"Ferment"},{l1:"Off",l2:"Sulfury",l3:"Rubber",src:"Ferment"},
  {l1:"Off",l2:"Chemical",l3:"Solvent",src:"Ferment"},{l1:"Off",l2:"Chemical",l3:"Metallic",src:"Ferment"},{l1:"Off",l2:"Chemical",l3:"Soapy",src:"Ferment"}
];

// Order = the order families appear, going clockwise from 12 o'clock
const FAMILY_ORDER = ["Floral","Fruity","Cereal","Earthy","Wood","Spice","Sweet","Savory","Structure","Off"];

// Graduated palette per family — L1=base, L2=mid, L3=light.
const PALETTE = {
  "Floral":        { l1: "#A8456E", l2: "#C77897", l3: "#E8C2D1" },
  "Fruity":        { l1: "#B85A2B", l2: "#D9874E", l3: "#F1C9A6" },
  "Cereal":        { l1: "#C29632", l2: "#D9B45E", l3: "#EFD9A0" },
  "Earthy": { l1: "#7A8A3A", l2: "#A1AC68", l3: "#D2D6A8" },
  "Wood":          { l1: "#5C3A1E", l2: "#8A684A", l3: "#C2A98E" },
  "Spice":         { l1: "#9C3A2C", l2: "#BD6B5C", l3: "#E2B4A8" },
  "Sweet":         { l1: "#B8722A", l2: "#D29D5A", l3: "#EED2A7" },
  "Savory":        { l1: "#7A2E25", l2: "#9F5C53", l3: "#D2A89F" },
  "Structure":     { l1: "#506876", l2: "#7E94A0", l3: "#BFCCD3" },
  "Off":           { l1: "#5F4B66", l2: "#897790", l3: "#C4B7CB" }
};

// Source key — the thin band at the base of the leaf ring.
const SOURCES = [
  { key: "Grain",   color: "#C9A227", note: "Mash bill: corn, rye, wheat, malt, peated malt" },
  { key: "Ferment", color: "#7B4F8C", note: "Yeast, fermentation and the still" },
  { key: "Wood",    color: "#4A2C14", note: "The barrel: toast, char and oak extractives" },
  { key: "Finishing", color: "#8A2432", note: "Prior contents and finishing casks" },
  { key: "Proof",   color: "#2F6A86", note: "Strength, texture and taste" }
];
const SOURCE_COLOR = Object.fromEntries(SOURCES.map(s => [s.key, s.color]));

//============================================================
// GROUP DATA
//============================================================
function buildTree() {
  const fam = new Map();
  for (const r of RAW) {
    if (!fam.has(r.l1)) fam.set(r.l1, { name: r.l1, subs: new Map() });
    const f = fam.get(r.l1);
    if (!f.subs.has(r.l2)) f.subs.set(r.l2, { name: r.l2, leaves: [] });
    f.subs.get(r.l2).leaves.push({ name: r.l3, src: r.src });
  }
  return FAMILY_ORDER.map(name => ({ name, subs: [...fam.get(name).subs.values()] }));
}
const TREE = buildTree();

//============================================================
// GEOMETRY
//============================================================
const CX = 800, CY = 800;
const R_INNER_HOLE = 140;
const R_L1_OUT     = 360;
const R_L2_OUT     = 540;
const R_L3_OUT     = 780;
const BAND         = 11;     // source band width at the base of the leaf ring
const START_CLOCK  = 0;

function clockToRotateDeg(clockAngle) { return clockAngle - 90; }
function polar(r, clockAngle) {
  const a = (clockAngle - 90) * Math.PI / 180;
  return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
}
function annularSector(rIn, rOut, a1, a2) {
  const [x1, y1] = polar(rOut, a1);
  const [x2, y2] = polar(rOut, a2);
  const [x3, y3] = polar(rIn,  a2);
  const [x4, y4] = polar(rIn,  a1);
  const large = (a2 - a1) > 180 ? 1 : 0;
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} `
       + `A ${rOut} ${rOut} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} `
       + `L ${x3.toFixed(2)} ${y3.toFixed(2)} `
       + `A ${rIn} ${rIn} 0 ${large} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
}
function arcPath(r, a1, a2, dir = 1) {
  if (dir === -1) [a1, a2] = [a2, a1];
  const [x1, y1] = polar(r, a1);
  const [x2, y2] = polar(r, a2);
  const sweep = dir === 1 ? 1 : 0;
  const large = Math.abs(a2 - a1) > 180 ? 1 : 0;
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} ${sweep} ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}

//============================================================
// LAYOUT — every leaf gets the same arc
//============================================================
const TOTAL_LEAVES = RAW.length;
let cursor = START_CLOCK;
const layout = [];
for (const fam of TREE) {
  const leafCount = fam.subs.reduce((s, sub) => s + sub.leaves.length, 0);
  const famArc = (leafCount / TOTAL_LEAVES) * 360;
  const famStart = cursor, famEnd = cursor + famArc;
  const subs = [];
  let subCursor = famStart;
  for (const sub of fam.subs) {
    const subArc = (sub.leaves.length / leafCount) * famArc;
    const subStart = subCursor, subEnd = subCursor + subArc;
    const leafArc = subArc / sub.leaves.length;
    const leaves = sub.leaves.map((lf, i) => ({
      name: lf.name, src: lf.src,
      start: subStart + i * leafArc,
      end:   subStart + (i + 1) * leafArc
    }));
    subs.push({ name: sub.name, start: subStart, end: subEnd, leaves });
    subCursor = subEnd;
  }
  layout.push({ name: fam.name, start: famStart, end: famEnd, subs, leafCount });
  cursor = famEnd;
}

//============================================================
// RENDER
//============================================================
const SVG = document.getElementById('wheel');
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent = SVG) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}
const defs = el('defs');
let pathCounter = 0;
function defArc(r, a1, a2, dir = 1) {
  const id = `arc-${pathCounter++}`;
  el('path', { id, d: arcPath(r, a1, a2, dir), fill: 'none' }, defs);
  return id;
}

el('circle', { cx: CX, cy: CY, r: R_L3_OUT + 8, fill: '#FAF6EC' });
el('circle', { cx: CX, cy: CY, r: R_L3_OUT + 6, fill: 'none', stroke: '#CC9900', 'stroke-width': 1.2 });
el('circle', { cx: CX, cy: CY, r: R_L3_OUT + 14, fill: 'none', stroke: '#CC9900', 'stroke-width': 0.6, opacity: 0.5 });

for (const fam of layout) {
  const pal = PALETTE[fam.name];
  const g = el('g', { 'data-family': fam.name });
  el('path', {
    class: 'wedge l1', 'data-family': fam.name,
    d: annularSector(R_INNER_HOLE, R_L1_OUT, fam.start, fam.end),
    fill: pal.l1, stroke: '#FAF6EC', 'stroke-width': 1.5, 'stroke-linejoin': 'round'
  }, g);
  for (const sub of fam.subs) {
    el('path', {
      class: 'wedge l2', 'data-family': fam.name, 'data-l2': sub.name,
      d: annularSector(R_L1_OUT, R_L2_OUT, sub.start, sub.end),
      fill: pal.l2, stroke: '#FAF6EC', 'stroke-width': 1.2, 'stroke-linejoin': 'round'
    }, g);
    for (const leaf of sub.leaves) {
      el('path', {
        class: 'wedge l3', 'data-family': fam.name, 'data-l2': sub.name, 'data-l3': leaf.name,
        d: annularSector(R_L2_OUT, R_L3_OUT, leaf.start, leaf.end),
        fill: pal.l3, stroke: '#FAF6EC', 'stroke-width': 0.8, 'stroke-linejoin': 'round'
      }, g);
    }
  }
}

// Source band — one segment per leaf, merged visually where neighbours share a source
const bandG = el('g', { class: 'src-band-group' });
for (const fam of layout) for (const sub of fam.subs) for (const leaf of sub.leaves) {
  const p = el('path', {
    class: 'src-band', 'data-src': leaf.src,
    d: annularSector(R_L2_OUT, R_L2_OUT + BAND, leaf.start, leaf.end),
    fill: SOURCE_COLOR[leaf.src]
  }, bandG);
  el('title', {}, p).textContent = `${leaf.name} — source: ${leaf.src}`;
}

el('circle', { cx: CX, cy: CY, r: R_L1_OUT, fill: 'none', stroke: '#CC9900', 'stroke-width': 0.7, opacity: 0.55 });
el('circle', { cx: CX, cy: CY, r: R_L2_OUT, fill: 'none', stroke: '#CC9900', 'stroke-width': 0.7, opacity: 0.55 });
el('circle', { cx: CX, cy: CY, r: R_L3_OUT, fill: 'none', stroke: '#CC9900', 'stroke-width': 0.9 });

//============================================================
// LABELS
//============================================================
function arcLenAt(r, a1, a2) { return Math.abs(a2 - a1) * Math.PI / 180 * r; }
function radialText(cls, family, text, mid, rPad, attrs = {}) {
  const flip = mid > 180 && mid < 360;
  const rotDeg = flip ? clockToRotateDeg(mid) + 180 : clockToRotateDeg(mid);
  const t = el('text', Object.assign({
    class: cls, 'data-family': family,
    transform: `rotate(${rotDeg.toFixed(2)} ${CX} ${CY})`,
    'text-anchor': flip ? 'end' : 'start',
    'dominant-baseline': 'middle',
    x: flip ? (CX - rPad) : (CX + rPad), y: CY
  }, attrs));
  t.textContent = text;
  return t;
}

// L1 — curved along the ring where the family is wide enough, radial where it is narrow.
const R_L1_TEXT = (R_INNER_HOLE + R_L1_OUT) / 2;
for (const fam of layout) {
  const mid = (fam.start + fam.end) / 2;
  const txt = fam.name.toUpperCase();
  const maxArc = arcLenAt(R_L1_TEXT, fam.start, fam.end) * 0.82;
  const naturalEst = txt.length * 22;
  if (naturalEst <= maxArc * 1.12) {
    const lower = mid > 90 && mid < 270;
    const id = defArc(R_L1_TEXT, fam.start, fam.end, lower ? -1 : 1);
    const t = el('text', { class: 'l1-text', 'data-family': fam.name });
    const tp = document.createElementNS(NS, 'textPath');
    tp.setAttribute('href', `#${id}`);
    tp.setAttribute('startOffset', '50%');
    tp.setAttribute('text-anchor', 'middle');
    tp.setAttribute('dominant-baseline', 'middle');
    if (naturalEst > maxArc) { tp.setAttribute('textLength', maxArc.toFixed(1)); tp.setAttribute('lengthAdjust', 'spacingAndGlyphs'); }
    tp.textContent = txt;
    t.appendChild(tp);
  } else {
    const est = txt.length * 17.5;
    const attrs = { 'font-size': 23 };
    if (est > 196) { attrs.textLength = 196; attrs.lengthAdjust = 'spacingAndGlyphs'; }
    radialText('l1-text l1-radial', fam.name, txt, mid, R_INNER_HOLE + 12, attrs);
  }
}

// L2 — radial
for (const fam of layout) for (const sub of fam.subs) {
  radialText('l2-text', fam.name, sub.name.toUpperCase(), (sub.start + sub.end) / 2, R_L1_OUT + 14, { 'data-l2': sub.name });
}

// L3 — radial, just outside the source band
for (const fam of layout) for (const sub of fam.subs) for (const leaf of sub.leaves) {
  radialText('l3-text', fam.name, leaf.name, (leaf.start + leaf.end) / 2, R_L2_OUT + BAND + 9, { 'data-l2': sub.name, 'data-l3': leaf.name });
}

//============================================================
// CENTER MEDALLION
//============================================================
el('circle', { cx: CX, cy: CY, r: R_INNER_HOLE, fill: '#F4ECDA' });
el('circle', { cx: CX, cy: CY, r: R_INNER_HOLE - 4, fill: 'none', stroke: '#CC9900', 'stroke-width': 1.2 });
el('circle', { cx: CX, cy: CY, r: R_INNER_HOLE - 14, fill: 'none', stroke: '#996633', 'stroke-width': 0.5, opacity: 0.5 });
el('circle', { cx: CX, cy: CY, r: 4, fill: '#CC9900' });

//============================================================
// LEGEND (wheel page only)
//============================================================
const legendEl = document.getElementById('legend');
if (legendEl) {
  for (const fam of layout) {
    const pal = PALETTE[fam.name];
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `
      <span class="swatch" style="background:${pal.l1}"></span>
      <span class="swatch" style="background:${pal.l2}"></span>
      <span class="swatch" style="background:${pal.l3}"></span>
      &nbsp;<b>${fam.name}</b>&nbsp;<span class="count">${fam.leafCount}</span>`;
    legendEl.appendChild(row);
  }
}
const sourceEl = document.getElementById('source-key');
if (sourceEl) {
  const counts = {};
  for (const r of RAW) counts[r.src] = (counts[r.src] || 0) + 1;
  sourceEl.innerHTML = '<p class="source-key-title">Source band &mdash; where each flavor comes from</p>' +
    SOURCES.map(s => `<div class="source-row"><span class="source-chip" style="background:${s.color}"></span><b>${s.key}</b><span class="count">${counts[s.key] || 0}</span><span class="source-note">${s.note}</span></div>`).join('');
}

//============================================================
// TASTING-NOTE HIGHLIGHTS
// Keys are leaf names (L3) or, when a note only names a group, group names (L2).
//============================================================
const TASTING = {};
const PHASE_COLOR = { N: '#5C3A1E', P: '#B85A2B', F: '#1A1410' };

function addPips(r, mid, phases, square) {
  const spread = 18, size = 8;
  const offsets = phases.length === 1 ? [0] : phases.length === 2 ? [-spread/2, spread/2] : [-spread, 0, spread];
  phases.forEach((p, idx) => {
    const ang = mid + (offsets[idx] / r) * 180 / Math.PI;
    const [px, py] = polar(r, ang);
    if (square) {
      el('rect', { x: (px - size).toFixed(2), y: (py - size).toFixed(2), width: size * 2, height: size * 2, rx: 3,
        fill: PHASE_COLOR[p], stroke: '#FAF6EC', 'stroke-width': 1.5, class: 'phase-pip group-pip is-tagged' });
    } else {
      el('circle', { cx: px.toFixed(2), cy: py.toFixed(2), r: size,
        fill: PHASE_COLOR[p], stroke: '#FAF6EC', 'stroke-width': 1.5, class: 'phase-pip is-tagged' });
    }
    el('text', { x: px.toFixed(2), y: py.toFixed(2), 'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-family': 'Cinzel, serif', 'font-weight': 700, 'font-size': 11, fill: '#FAF6EC',
      class: 'phase-pip-label is-tagged', 'pointer-events': 'none' }).textContent = p;
  });
}
const q  = (sel) => [...SVG.querySelectorAll(sel)];
const qa = (name) => name.replace(/\\/g, '\\\\').replace(/"/g, '\\"');

// tagWheel(T): light up the wheel for a TASTING-shaped object. Called below for this page's own
// TASTING; pages that build TASTING later (e.g. a taster's personal map) can call it themselves.
let hoverOn = false;
function tagWheel(TASTING) {
  if (!TASTING || !Object.keys(TASTING).length) return;
  hoverOn = false;
  SVG.classList.remove('has-hover');
  SVG.querySelectorAll('.is-hot').forEach(n => n.classList.remove('is-hot'));
  SVG.classList.add('has-tasting');
  for (const fam of layout) {
    let famTagged = false;
    for (const sub of fam.subs) {
      const subPh = TASTING[sub.name];
      const leafTagged = sub.leaves.some(l => TASTING[l.name]);
      if (!subPh && !leafTagged) continue;
      famTagged = true;
      q(`.wedge.l2[data-l2="${qa(sub.name)}"], .l2-text[data-l2="${qa(sub.name)}"]`).forEach(n => n.classList.add('is-tagged'));
      if (subPh) {
        q(`.wedge.l2[data-l2="${qa(sub.name)}"]`).forEach(w => { w.setAttribute('stroke', '#1A1410'); w.setAttribute('stroke-width', '1.6'); });
        q(`.wedge.l3[data-l2="${qa(sub.name)}"], .l3-text[data-l2="${qa(sub.name)}"]`).forEach(n => n.classList.add('is-group'));
        addPips(R_L2_OUT - 16, (sub.start + sub.end) / 2, subPh, true);
      }
      for (const leaf of sub.leaves) {
        const phases = TASTING[leaf.name];
        if (!phases) continue;
        q(`.wedge.l3[data-l3="${qa(leaf.name)}"], .l3-text[data-l3="${qa(leaf.name)}"]`).forEach(n => n.classList.add('is-tagged'));
        q(`.wedge.l3[data-l3="${qa(leaf.name)}"]`).forEach(w => { w.setAttribute('stroke', '#1A1410'); w.setAttribute('stroke-width', '1.6'); });
        addPips(R_L3_OUT + 16, (leaf.start + leaf.end) / 2, phases, false);
      }
    }
    if (famTagged) q(`.wedge.l1[data-family="${qa(fam.name)}"], .l1-text[data-family="${qa(fam.name)}"]`).forEach(n => n.classList.add('is-tagged'));
  }
}

// Wheel page: hover a family to isolate it (off once a tasting is plotted)
function setHotFamily(name) {
  SVG.querySelectorAll('.is-hot').forEach(n => n.classList.remove('is-hot'));
  if (!name) { SVG.classList.remove('has-hover'); return; }
  SVG.classList.add('has-hover');
  q(`[data-family="${qa(name)}"]`).forEach(n => n.classList.add('is-hot'));
}
SVG.addEventListener('mouseover', (e) => { if (!hoverOn) return; const t = e.target.closest('[data-family]'); if (t) setHotFamily(t.getAttribute('data-family')); });
SVG.addEventListener('mouseleave', () => { if (hoverOn) setHotFamily(null); });

if (Object.keys(TASTING).length) tagWheel(TASTING); else hoverOn = true;

</script>

// Phrases that only name a group (L2): the group is tagged, never guessed leaves.
const PHRASES = {"baking spice": ["Baking"], "baking spices": ["Baking"], "warm spices": ["Baking"], "stone fruit": ["Stone"], "stone fruits": ["Stone"], "dried fruit": ["Dried"], "dried fruits": ["Dried"], "berry": ["Berry"], "berries": ["Berry"], "jam": ["Berry"], "jammy": ["Berry"], "citrus": ["Citrus"], "tropical": ["Tropical"], "tropical fruit": ["Tropical"], "mango": ["Tropical"], "papaya": ["Tropical"], "passion fruit": ["Tropical"], "kiwi": ["Tropical"], "grain": ["Grain"], "grainy": ["Grain"], "cereal": ["Grain"], "oat": ["Grain"], "oats": ["Grain"], "oatmeal": ["Grain"], "granola": ["Grain"], "earthy": ["Ground"], "earth": ["Ground"], "dirt": ["Ground"], "soil": ["Ground"], "forest floor": ["Ground"], "potato": ["Ground"], "carrot": ["Ground"], "oak": ["Oak"], "oaky": ["Oak"], "wood": ["Oak"], "woody": ["Oak"], "barrel": ["Oak"], "nutty": ["Nuts"], "nuts": ["Nuts"], "sugar": ["Syrupy"], "syrup": ["Syrupy"], "syrupy": ["Syrupy"], "simple syrup": ["Syrupy"], "candy": ["Candy"], "candied": ["Candy"]};

// Every term -> its leaves, longest first, so "dr pepper" claims its words before "pepper" can.
const TERMS = (function () {
  const list = [];
  for (const r of RAW) {
    const n = r.l3.toLowerCase();
    list.push([n, [r.l3]]);
    list.push([/(s|sh|ch|x)$/.test(n) ? n + 'es' : /[^aeiou]y$/.test(n) ? n.slice(0, -1) + 'ies' : n + 's', [r.l3]]);
    (SYNONYMS[r.l3] || []).forEach(w => list.push([w, [r.l3]]));
  }
  Object.keys(PHRASES).forEach(w => list.push([w, PHRASES[w]]));
  return list.sort((a, b) => b[0].length - a[0].length);
})();

function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// Leaves a note mentions, in the order they're written.
function leavesIn(text) {
  let t = ' ' + (text || '').toLowerCase().replace(/[‘’]/g, "'") + ' ';
  const hits = [];
  for (const [term, leaves] of TERMS) {
    const re = new RegExp('(^|[^a-z])(' + reEsc(term).replace(/ /g, '[\\s-]+') + ')(?![a-z])', 'g');
    let m;
    while ((m = re.exec(t))) {
      const at = m.index + m[1].length, len = m[2].length;
      leaves.forEach((leaf, i) => hits.push({ leaf, at: at + i / 10 }));
      // Blank the matched words so a shorter term can't claim them again.
      t = t.slice(0, at) + ' '.repeat(len) + t.slice(at + len);
      re.lastIndex = at + len;
    }
  }
  const seen = new Set(), out = [];
  hits.sort((a, b) => a.at - b.at).forEach(h => { if (!seen.has(h.leaf)) { seen.add(h.leaf); out.push(h.leaf); } });
  return out;
}


// A group tag is redundant when one of its leaves is already named in the same note.
const GROUP_NAMES = new Set(RAW.map(r => r.l2));
const GROUP_OF = Object.fromEntries(RAW.map(r => [r.l3, r.l2]));
function tidy(tags) { return tags.filter(t => !GROUP_NAMES.has(t) || !tags.some(x => GROUP_OF[x] === t)); }

//============================================================
// PAGE
//============================================================
(function () {
  const $ = id => document.getElementById(id);
  const toLogin = () => window.location.replace('login.html');
  function esc(s) { return (s == null ? '' : '' + s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fail(msg) { $('gate').textContent = msg; }

  const configured = window.SUPABASE_ANON_KEY && window.SUPABASE_ANON_KEY.indexOf('PASTE_') !== 0;
  if (!configured || !window.supabase) { toLogin(); return; }
  const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  const params = new URLSearchParams(location.search), id = params.get('id');
  // Shown inside My Catalog's note pop-up: the pop-up has its own close button.
  if (params.has('embed')) document.querySelector('.back').style.display = 'none';

  function render(r) {
    document.title = r.expression + ' — My Tasting Map';
    $('mTitle').textContent = r.expression;
    $('mTagline').textContent = r.event_name;
    const spec = [];
    if (r.category) spec.push(esc(r.category));
    if (r.rating != null) spec.push('<b>Rated ' + esc(r.rating) + '</b>');
    if (r.bbb) spec.push(esc(r.bbb));
    $('mSpec').innerHTML = spec.join(' &middot; ');
    const d = (r.event_date || r.created_at || '').slice(0, 10).split('-');
    $('mTasted').innerHTML = d.length === 3 ? 'Tasted ' + d[1] + '&middot;' + d[2] + '&middot;' + d[0] : 'Your tasting';

    const TASTING = {};
    const phases = [['N', 'nose', 'Nose', r.nose], ['P', 'palate', 'Palate', r.palate], ['F', 'finish', 'Finish', r.finish]];
    let total = 0;
    $('notes').innerHTML = phases.map(([code, cls, title, text]) => {
      const leaves = tidy(leavesIn(text));
      leaves.forEach(l => { (TASTING[l] = TASTING[l] || []).push(code); });
      total += leaves.length;
      const tags = leaves.length ? leaves.map(l => '<li' + (GROUP_NAMES.has(l) ? ' class="group"' : '') + '>' + esc(l) + '</li>').join('')
                                 : '<li class="none">' + (text ? 'No wheel flavors found' : 'Not noted') + '</li>';
      return '<article class="note-card"><div class="note-head"><span class="note-marker ' + cls + '">' + code + '</span>' +
        '<h2 class="note-title">' + title + '</h2></div><hr class="note-rule" />' +
        '<p class="note-body' + (text ? '' : ' none') + '">' + (text ? esc(text) : 'No ' + title.toLowerCase() + ' notes for this tasting.') + '</p>' +
        '<ul class="note-tags">' + tags + '</ul></article>';
    }).join('');
    if (!total) {
      $('mUnmatched').textContent = 'None of your notes named a flavor on the wheel yet. Edit this tasting in My Tastings with words like vanilla, cherry, oak or black pepper to light it up.';
      $('mUnmatched').hidden = false;
    }
    tagWheel(TASTING);
    $('gate').style.display = 'none';
    $('page').hidden = false;
  }

  sb.auth.getSession().then(res => {
    const s = res && res.data ? res.data.session : null;
    if (!s) { toLogin(); return; }
    if (!id) { fail('No tasting was chosen. Open a Tasting Map from My Catalog.'); return; }
    // RLS returns only the signed-in taster's own rows.
    return sb.from('tasting_history').select('*').eq('id', id).maybeSingle().then(r => {
      if (r.error) { fail('Could not load this tasting: ' + r.error.message); return; }
      if (!r.data) { fail('This tasting map isn’t in your catalog.'); return; }
      render(r.data);
    });
  }).catch(toLogin);
})();
