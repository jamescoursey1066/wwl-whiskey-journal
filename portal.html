<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Whiskey Journal Portal &middot; WWL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0A06; --card:#1C1612; --line:rgba(204,153,0,.25);
    --gold:#CC9900; --gold-lt:#E8C76A; --cream:#FAF6EC; --body:#E8DCC1; --muted:#9a8f7d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--body);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 40px;background:rgba(14,10,6,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(4px);}
  .wordmark{font-family:'Cinzel',Georgia,serif;font-size:15px;letter-spacing:.16em;color:var(--cream);text-decoration:none;line-height:1.3;}
  .wordmark small{display:block;font-size:10.5px;letter-spacing:.22em;color:var(--gold);}
  .nav-right{display:flex;align-items:center;gap:12px;}
  .who{font-size:15px;color:var(--muted);font-style:italic;}
  .home-btn{font-family:'Cinzel',Georgia,serif;font-size:11px;letter-spacing:.16em;color:var(--cream);text-decoration:none;
    border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:7px 16px;white-space:nowrap;cursor:pointer;background:none;transition:all .15s;}
  .home-btn:hover{background:var(--cream);color:var(--bg);}
  .gate{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;color:var(--muted);font-style:italic;}
  .wrap{max-width:760px;margin:0 auto;padding:80px 40px;text-align:center;display:none;}
  .eyebrow{font-family:'Cinzel',Georgia,serif;font-size:12px;letter-spacing:.28em;color:var(--gold);margin-bottom:18px;}
  h1{font-family:'Cinzel',Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,60px);letter-spacing:.04em;color:var(--cream);line-height:1.05;}
  .divider{width:56px;height:1px;background:var(--gold);margin:30px auto;}
  .lede{max-width:560px;margin:0 auto;font-style:italic;font-size:20px;color:var(--gold-lt);}
  .note{max-width:560px;margin:26px auto 0;font-size:18px;color:var(--body);}
  @media(max-width:640px){header.top{padding:14px 18px;}.wrap{padding:56px 18px;}body{font-size:17px;}.who{display:none;}}
</style>
</head>
<body>
<header class="top">
  <a class="wordmark" href="index.html">WORLD WHISKEY LEAGUE<small>WHISKEY JOURNAL</small></a>
  <div class="nav-right">
    <span class="who" id="who"></span>
    <button class="home-btn" id="signOutBtn" title="Sign out of your portal" style="display:none;">Sign Out</button>
    <a class="home-btn" href="index.html" title="Back to The Whiskey Journal homepage">Home</a>
  </div>
</header>

<div class="gate" id="gate">Checking your credentials&hellip;</div>

<section class="wrap" id="wrap">
  <p class="eyebrow">Premium Taster Portal</p>
  <h1>Under Construction</h1>
  <div class="divider"></div>
  <p class="lede">Your personal Whiskey Journal portal is being built.</p>
  <p class="note">Check back soon &mdash; your tasting history, event details, and more are on the way. Cheers!</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
  var gate = document.getElementById('gate');
  var wrap = document.getElementById('wrap');
  var who = document.getElementById('who');
  var signOutBtn = document.getElementById('signOutBtn');

  function toLogin(){ window.location.replace('login.html'); }

  var configured = window.SUPABASE_ANON_KEY && window.SUPABASE_ANON_KEY.indexOf('PASTE_') !== 0;
  if (!configured || !window.supabase) { toLogin(); return; }

  var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  sb.auth.getSession().then(function(res){
    var session = res && res.data ? res.data.session : null;
    if (!session) { toLogin(); return; }
    // Authenticated: reveal the portal.
    gate.style.display = 'none';
    wrap.style.display = 'block';
    var email = session.user && session.user.email ? session.user.email : '';
    if (email) who.textContent = 'Signed in as ' + email;
    signOutBtn.style.display = 'inline-block';
  }).catch(function(){ toLogin(); });

  signOutBtn.addEventListener('click', function(){
    signOutBtn.disabled = true;
    sb.auth.signOut().then(function(){ toLogin(); }).catch(function(){ toLogin(); });
  });

  // If the session ends in another tab, kick back to login.
  sb.auth.onAuthStateChange(function(event, session){
    if (!session) toLogin();
  });
})();
</script>
</body>
</html>
