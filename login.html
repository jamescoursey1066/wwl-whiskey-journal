<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premium Taster Login &middot; WWL Whiskey Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0A06; --card:#1C1612; --line:rgba(204,153,0,.25);
    --gold:#CC9900; --gold-lt:#E8C76A; --cream:#FAF6EC; --body:#E8DCC1; --muted:#9a8f7d; --err:#D9534F;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--body);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 40px;background:rgba(14,10,6,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(4px);}
  .wordmark{font-family:'Cinzel',Georgia,serif;font-size:15px;letter-spacing:.16em;color:var(--cream);text-decoration:none;line-height:1.3;}
  .wordmark small{display:block;font-size:10.5px;letter-spacing:.22em;color:var(--gold);}
  .home-btn{font-family:'Cinzel',Georgia,serif;font-size:11px;letter-spacing:.16em;color:var(--cream);text-decoration:none;
    border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:7px 16px;white-space:nowrap;transition:all .15s;}
  .home-btn:hover{background:var(--cream);color:var(--bg);}
  .hero{max-width:520px;margin:0 auto;padding:60px 40px 8px;text-align:center;}
  .eyebrow{font-family:'Cinzel',Georgia,serif;font-size:12px;letter-spacing:.28em;color:var(--gold);margin-bottom:16px;}
  h1.title{font-family:'Cinzel',Georgia,serif;font-weight:500;font-size:clamp(30px,5vw,46px);letter-spacing:.04em;color:var(--cream);line-height:1.08;}
  .sub{max-width:460px;margin:16px auto 0;font-style:italic;font-size:18px;color:var(--gold-lt);}
  .divider{width:56px;height:1px;background:var(--gold);margin:24px auto 0;}
  main{max-width:460px;margin:0 auto;padding:22px 40px 90px;}
  form{background:var(--card);border:1px solid var(--line);padding:30px 32px 28px;}
  .field{margin-bottom:18px;}
  label{display:block;font-family:'Cinzel',Georgia,serif;font-size:11px;letter-spacing:.16em;color:var(--gold-lt);text-transform:uppercase;margin-bottom:8px;}
  input{width:100%;background:#120D08;color:var(--cream);border:1px solid rgba(204,153,0,.35);padding:11px 13px;
    font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;transition:border-color .15s,box-shadow .15s;}
  input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(204,153,0,.18);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap;}
  button.send{font-family:'Cinzel',Georgia,serif;font-size:12px;letter-spacing:.18em;color:var(--bg);background:var(--gold);
    border:1px solid var(--gold);border-radius:22px;padding:11px 30px;cursor:pointer;transition:all .15s;}
  button.send:hover{background:var(--gold-lt);border-color:var(--gold-lt);}
  button.send:disabled{opacity:.6;cursor:default;}
  .link{background:none;border:none;color:var(--gold-lt);font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;
    font-style:italic;cursor:pointer;text-decoration:none;border-bottom:1px solid transparent;padding:0;}
  .link:hover{border-bottom-color:var(--gold);}
  .msg{margin-top:18px;padding:13px 15px;font-size:16px;line-height:1.45;border:1px solid;display:none;}
  .msg.show{display:block;}
  .msg.error{color:#F3C6C4;border-color:var(--err);background:rgba(217,83,79,.12);}
  .msg.ok{color:var(--gold-lt);border-color:var(--gold);background:rgba(204,153,0,.10);}
  footer{max-width:460px;margin:0 auto;padding:0 40px 80px;text-align:center;}
  footer a{color:var(--gold-lt);text-decoration:none;font-family:'Cinzel',Georgia,serif;font-size:12px;letter-spacing:.16em;border-bottom:1px solid var(--gold);padding-bottom:5px;}
  @media(max-width:640px){header.top{padding:14px 18px;}.hero{padding:44px 18px 6px;}main{padding:18px 18px 70px;}form{padding:24px 20px 22px;}body{font-size:17px;}}
</style>
</head>
<body>
<header class="top">
  <a class="wordmark" href="index.html">WORLD WHISKEY LEAGUE<small>WHISKEY JOURNAL</small></a>
  <a class="home-btn" href="index.html" title="Back to The Whiskey Journal homepage">Home</a>
</header>

<section class="hero">
  <p class="eyebrow">World Whiskey League</p>
  <h1 class="title">Premium Taster Login</h1>
  <p class="sub">Sign in to reach your personal Whiskey Journal portal.</p>
  <div class="divider"></div>
</section>

<main>
  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
    </div>
    <div class="row">
      <button type="submit" class="send" id="signInBtn">Sign In</button>
      <button type="button" class="link" id="forgotBtn">Forgot your password?</button>
    </div>
    <div class="msg" id="msg" role="alert" aria-live="polite"></div>
  </form>
</main>

<footer>
  <a href="index.html">Return to The Whiskey Journal &rarr;</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
  var msg = document.getElementById('msg');
  var form = document.getElementById('loginForm');
  var signInBtn = document.getElementById('signInBtn');
  var forgotBtn = document.getElementById('forgotBtn');
  var emailEl = document.getElementById('email');
  var pwEl = document.getElementById('password');

  function setMsg(t, kind){ msg.textContent = t; msg.className = 'msg show ' + kind; }
  function clearMsg(){ msg.textContent=''; msg.className='msg'; }

  var configured = window.SUPABASE_ANON_KEY && window.SUPABASE_ANON_KEY.indexOf('PASTE_') !== 0;
  if (!configured || !window.supabase) {
    setMsg('Premium taster login is not configured yet. Please check back soon.', 'error');
    signInBtn.disabled = true;
    return;
  }

  var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  // Already signed in? Go straight to the portal.
  sb.auth.getSession().then(function(res){
    if (res && res.data && res.data.session) window.location.replace('portal.html');
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    clearMsg();
    var email = (emailEl.value || '').trim();
    var password = pwEl.value || '';
    if (!email || !password) { setMsg('Please enter both your email and password.', 'error'); return; }

    signInBtn.disabled = true;
    var label = signInBtn.textContent;
    signInBtn.textContent = 'Signing in…';

    sb.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      if (res.error) {
        setMsg(res.error.message || 'Sign-in failed. Please check your email and password.', 'error');
        signInBtn.disabled = false;
        signInBtn.textContent = label;
        return;
      }
      window.location.replace('portal.html');
    }).catch(function(){
      setMsg('Something went wrong reaching the server. Please try again in a moment.', 'error');
      signInBtn.disabled = false;
      signInBtn.textContent = label;
    });
  });

  forgotBtn.addEventListener('click', function(){
    clearMsg();
    var email = (emailEl.value || '').trim();
    if (!email) { setMsg('Enter your email address above first, then click "Forgot your password?" and we’ll send a reset link.', 'error'); emailEl.focus(); return; }
    forgotBtn.disabled = true;
    sb.auth.resetPasswordForEmail(email, { redirectTo: window.WWL_SITE_URL + 'reset-password.html' }).then(function(res){
      if (res.error) { setMsg(res.error.message || 'Could not send the reset email. Please try again.', 'error'); }
      else { setMsg('If an account exists for ' + email + ', a password-reset link is on its way. Check your inbox (and spam).', 'ok'); }
      forgotBtn.disabled = false;
    }).catch(function(){
      setMsg('Something went wrong sending the reset email. Please try again in a moment.', 'error');
      forgotBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
